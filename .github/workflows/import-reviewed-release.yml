name: Import reviewed appointment release
on:
  push:
    branches: [release/booking-blue-white-20261025]
    paths: [.github/workflows/import-reviewed-release.yml]
permissions:
  contents: write
concurrency:
  group: import-reviewed-appointment-release
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'aijaraix/joshmobileinc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/booking-blue-white-20261025
      - name: Fetch exact reviewed source and validate archive
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 90 'https://sb-8u55a3xh8atk.vercel.run/appointment-release.tar.gz' -o /tmp/appointment-release.tar.gz
          echo 'b9c74b294f3a0cfaaea365e15315affd8bf76e16ee210f61062ad481e0cd71fe  /tmp/appointment-release.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import tarfile,pathlib
          allowed={'api','lib','public','scripts','tests','docs','integrations','README.md','package.json','package-lock.json','vercel.json','.gitignore'}
          with tarfile.open('/tmp/appointment-release.tar.gz') as t:
              members=t.getmembers()
              assert len(members)==67
              assert sum(m.size for m in members)<15000000
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and '..' not in p.parts and p.parts[0] in allowed
                  assert not any(s in p.parts for s in ['.git','.env','node_modules','.github'])
              t.extractall('.',members=members,filter='data')
          PY
          rm -f public/owner/owner.js public/owner/preview.html
      - name: Validate source and compile upload client
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Preserve ordinary source files and photos in GitHub
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api lib public scripts tests docs integrations README.md package.json package-lock.json vercel.json .gitignore
          git diff --cached --stat
          git commit -m 'Ship blue-white site, private appointment storage and individual staff accounts'
          git push origin HEAD:refs/heads/release/booking-blue-white-20261025

name: Test and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ${{ (vars.AICREATES_USE_GITHUB_HOSTED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","aicreates"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build


name: One-time approved public asset import
on:
  push:
    branches: [fix/request-first-brand-refresh]
    paths: [scripts/apply-public-refresh.py, .github/workflows/import-public-refresh.yml]
permissions:
  contents: write
concurrency:
  group: josh-public-brand-import
  cancel-in-progress: false
jobs:
  prepare-reviewed-source:
    if: github.repository == 'aijaraix/joshmobileinc' && github.ref == 'refs/heads/fix/request-first-brand-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Import hash-verified public assets and apply approved source corrections
        run: python3 scripts/apply-public-refresh.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Prepare review artifact without credentials or runtime data
        run: tar -czf /tmp/josh-public-refresh-source.tar.gz public lib api tests scripts docs package.json package-lock.json vercel.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-refresh-source
          path: /tmp/josh-public-refresh-source.tar.gz
          retention-days: 7
      - name: Commit only the reviewed public refresh to this branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          repo='aijaraix/joshmobileinc'
          branch='fix/request-first-brand-refresh'
          sha=os.environ['EXPECTED_SHA']
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          def api(path,method='GET',body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=None if body is None else json.dumps(body).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          assert api('git/ref/heads/'+branch)['object']['sha']==sha,'Branch moved; preserve concurrent work.'
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          added=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()
          entries=[]
          for name in sorted(set(changed+added)):
              assert name.startswith('public/') or name in ['scripts/check.mjs','tests/public-brand.test.mjs','docs/PUBLIC-BRAND-REFRESH.md','.github/workflows/import-public-refresh.yml'], 'Unexpected changed path: '+name
              path=pathlib.Path(name)
              if not path.exists():
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
                  continue
              data=path.read_bytes()
              assert len(data)<2_000_000
              blob=api('git/blobs','POST',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          assert entries
          tree=api('git/trees','POST',{'base_tree':api('git/commits/'+sha)['tree']['sha'],'tree':entries})
          commit=api('git/commits','POST',{'message':'Apply request-first copy, exterior hero, cabin photo and blue social metadata','tree':tree['sha'],'parents':[sha]})
          api('git/refs/heads/'+branch,'PATCH',{'sha':commit['sha'],'force':False})
          print('REVIEW_HEAD='+commit['sha'])
          print('Vendored source paths:',len(entries))
          PY
